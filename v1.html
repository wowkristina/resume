<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kristina_Wu_Resume</title>
  <style>
    :root{
      --bg1:#fff1f6;
      --bg2:#ffe4ef;
      --card:#ffffffcc;
      --text:#1f2937;
      --pink:#ff4d8d;
      --pink2:#ff77a8;
      --shadow: 0 12px 40px rgba(31,41,55,.15);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background: radial-gradient(1200px 600px at 20% 10%, var(--bg2), transparent 60%),
                  radial-gradient(900px 500px at 80% 30%, #ffeef6, transparent 55%),
                  linear-gradient(135deg, var(--bg1), #fff);
      overflow:hidden;
    }
    .hearts{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.35;
      filter: blur(.2px);
    }
    .heart{
      position:absolute;
      font-size: clamp(14px, 2vw, 22px);
      animation: floatUp linear infinite;
      transform: translateY(110vh);
    }
    @keyframes floatUp{
      from{ transform: translateY(110vh) translateX(0); }
      to{ transform: translateY(-20vh) translateX(40px); }
    }

    .card{
      width:min(720px, 92vw);
      padding: clamp(22px, 4vw, 42px);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.6);
      position: relative;
    }
    h1{
      margin:0 0 6px;
      font-size: clamp(26px, 4vw, 40px);
      letter-spacing:-.02em;
      text-align:center;
    }
    p{
      margin:0 0 16px;
      text-align:center;
      font-size: clamp(14px, 2vw, 18px);
      opacity:.85;
    }

    /* 📸 3 PHOTOS ROW */
    .photos{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      margin: 0 auto 26px;
      width:100%;
    }
    .photos img{
      width: 100%;
      max-width: 210px;          /* keeps 3 across nicely */
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 26px rgba(255,77,141,.20);
      border: 1px solid rgba(255,255,255,.7);
    }
    /* Mobile: wrap into 2 rows if needed */
    @media (max-width: 560px){
      .photos{ flex-wrap:wrap; }
      .photos img{ max-width: 46%; }
    }

    .playground{
      position:relative;
      height: 240px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.35));
      border: 1px dashed rgba(255,77,141,.35);
      overflow:hidden;
    }

    /* 🔽 SMALLER BUTTONS */
    .btn{
      border:0;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      user-select:none;
      position:absolute;
      min-width: 96px;
    }
    .btn:active{ transform: translateY(1px) scale(.99); }

    #yesBtn{
      left: 26%;
      top: 55%;
      transform: translate(-50%,-50%);
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      box-shadow: 0 8px 18px rgba(255,77,141,.30);
    }

    #noBtn{
      left: 72%;
      top: 55%;
      transform: translate(-50%,-50%);
      background: rgba(31,41,55,.08);
      color: #111827;
      box-shadow: 0 8px 14px rgba(31,41,55,.10);
      border: 1px solid rgba(31,41,55,.10);
    }

    .result{
      margin-top: 18px;
      text-align:center;
      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 700;
      min-height: 28px;
    }
    .small{
      margin-top:10px;
      text-align:center;
      font-size: 12px;
      opacity:.65;
    }
    .sparkle{
      display:inline-block;
      animation: pop .6s ease;
    }
    @keyframes pop{
      0%{ transform: scale(.7); opacity:0; }
      100%{ transform: scale(1); opacity:1; }
    }
  </style>
</head>
<body>

  <div class="hearts" id="hearts"></div>

  <div class="card">
    <h1>hi baby,</h1>
    <h1>will you be my valentine?</h1>
    <p>💖💖💖💖💖💖</p>

    <!-- 📸 3 PHOTOS -->
<div class="photos" aria-label="three photos">
  <img src="https://i.imgur.com/tcEiOyX.jpeg" alt="photo 1">
  <img src="https://i.imgur.com/FHdXyYE.jpeg" alt="photo 2">
  <img src="https://i.imgur.com/CBh0k1J.jpeg" alt="photo 3">
</div>

    <div class="playground" id="playground" aria-label="button area">
      <button class="btn" id="yesBtn">Yes 💖</button>
      <button class="btn" id="noBtn">No 🙃</button>
    </div>

<div class="small">
  <a
    href="https://www.youtube.com/watch?v=mgaeGW-2z6w"
    target="_blank"
    rel="noopener noreferrer"
    style="color:#ff4d8d; font-weight:600; text-decoration:none;"
  >
    *insert sexy love by neyo*
  </a>
</div>


  <script>
    const heartsWrap = document.getElementById("hearts");
    const heartEmojis = ["💗","💘","💞","💖","💝","💓","💟"];
    for (let i = 0; i < 22; i++){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
      h.style.left = Math.random()*100 + "vw";
      h.style.animationDuration = (6 + Math.random()*8) + "s";
      h.style.animationDelay = (-Math.random()*10) + "s";
      h.style.opacity = (0.25 + Math.random()*0.55).toFixed(2);
      heartsWrap.appendChild(h);
    }

    const playground = document.getElementById("playground");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");

    function moveNoButtonAwayFrom(x, y) {
      const box = playground.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();
      const cx = (btn.left - box.left) + btn.width / 2;
      const cy = (btn.top  - box.top)  + btn.height / 2;

      let dx = cx - x;
      let dy = cy - y;
      if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) {
        dx = Math.random() - 0.5;
        dy = Math.random() - 0.5;
      }

      const mag = Math.hypot(dx, dy) || 1;
      dx /= mag; dy /= mag;

      let newX = cx + dx * 120;
      let newY = cy + dy * 120;

      const pad = 14;
      newX = Math.max(pad, Math.min(box.width - pad, newX));
      newY = Math.max(pad, Math.min(box.height - pad, newY));

      noBtn.style.left = newX + "px";
      noBtn.style.top  = newY + "px";
    }

    function handleMouseMove(e){
      const box = playground.getBoundingClientRect();
      const mouseX = e.clientX - box.left;
      const mouseY = e.clientY - box.top;

      const btn = noBtn.getBoundingClientRect();
      const bx = (btn.left - box.left) + btn.width / 2;
      const by = (btn.top  - box.top)  + btn.height / 2;

      if (Math.hypot(mouseX - bx, mouseY - by) < 100) {
        moveNoButtonAwayFrom(mouseX, mouseY);
      }
    }

    function initNoButtonPixelPosition(){
      const box = playground.getBoundingClientRect();
      noBtn.style.left = (box.width * 0.72) + "px";
      noBtn.style.top  = (box.height * 0.55) + "px";
    }
    window.addEventListener("load", initNoButtonPixelPosition);
    window.addEventListener("resize", initNoButtonPixelPosition);

    playground.addEventListener("mousemove", handleMouseMove);

    yesBtn.addEventListener("click", () => {
      result.innerHTML = `<span class="sparkle">eeeek! shall we have steak for valentines day? 💖💖💖</span>`;
      playground.removeEventListener("mousemove", handleMouseMove);
      noBtn.disabled = true;
      noBtn.style.opacity = 0.5;
      noBtn.style.cursor = "not-allowed";
    });

    noBtn.addEventListener("click", () => {
      moveNoButtonAwayFrom(Math.random()*playground.clientWidth, Math.random()*playground.clientHeight);
      result.textContent = "that's not the right answer";
    });
  </script>
</body>
</html>
